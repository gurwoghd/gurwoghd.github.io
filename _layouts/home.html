<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
<main class="wrap page home">
  <section class="intro">
    {{ content }}
  </section>

  <section class="recent">
    <div class="recent-header">
      <h2>Recent Notes</h2>
      <a class="see-all" href="{{ '/notes/' | relative_url }}">See all →</a>
    </div>
    <ul class="post-list">
      {% for post in site.posts limit:5 %}
      <li class="post-list-item">
        <a href="{{ post.url | relative_url }}">
          <span class="post-list-title">{{ post.title }}</span>
          <span class="post-list-date">{{ post.date | date: "%b %-d, %Y" }}</span>
        </a>
      </li>
      {% else %}
      <li class="post-list-empty">No notes yet.</li>
      {% endfor %}
    </ul>
  </section>
</main>
{% include footer.html %}
</body>
</html>
