title: "Hyeokjae Hong"
description: "Notes and research on self-improving AI"
author: "Hyeokjae Hong"

baseurl: ""
url: "https://gurwoghd.github.io"

social:
  email: "hong_hyeokjae@gm.gist.ac.kr"
  cv: "/assets/cv.pdf"
  linkedin: "https://www.linkedin.com/in/hyeokjae-hong-2121b8320/"
  github: "https://github.com/gurwoghd"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

permalink: /notes/:year/:month/:day/:title/

collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
  - scope:
      path: ""
      type: research
    values:
      layout: research

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
